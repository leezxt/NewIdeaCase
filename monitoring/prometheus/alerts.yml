groups:
  - name: newideacase-platform
    rules:
      - alert: NewIdeaCaseAppDown
        expr: up{job="newideacase-app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: NewIdeaCase application is unavailable

      - alert: NewIdeaCaseHighErrorRate
        expr: >-
          sum(rate(http_server_requests_seconds_count{job="newideacase-app",status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(http_server_requests_seconds_count{job="newideacase-app"}[5m])), 0.001)
          > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: NewIdeaCase HTTP 5xx ratio exceeds 5 percent

      - alert: KnowledgeIngestionQueueBacklog
        expr: knowledge_ingestion_queue_size{status="pending"} > 20
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Knowledge ingestion queue has more than 20 pending tasks

      - alert: KnowledgeIngestionTaskFailed
        expr: increase(knowledge_ingestion_tasks_total{outcome="failed"}[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: A knowledge ingestion task reached terminal failure
